model:
  base_learning_rate: 1.0e-6
  target: ldm.models.autoencoder.VQFlowNet
  params:
    monitor: val/total_loss
    embed_dim: 3
    n_embed: 16384
    ddconfig:
      double_z: False
      z_channels: 8
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 64
      ch_mult: [1,2,2,2,4]  # f = 2 ^ len(ch_mult)
      num_res_blocks: 1
      cond_type: max_cross_attn
      attn_type: max
      attn_resolutions: [16]
      dropout: 0.0
      load_VFI: # ../ConsecutiveBrownianBridge/results/VQGAN/vimeo_new.ckpt

    lossconfig:
      target: ldm.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: False
        disc_in_channels: 3
        disc_start: 10000
        disc_weight: 0.5
        codebook_weight: 1.0 
        perceptual_weight: 1.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 20
    num_workers: 12
    wrap: false
    train:
      target: ldm.data.bvi_vimeo.Hydra_triplet
      params:
        db_dir: ../../phhydraB ## path to vimeo_triplet
        resize_sz: [512, 512]
        crop_sz: [256,256]
        aug_flip: true
        aug_reverse: false
        aug_rot: true
        aug_blur: true
        train: true
        small_dataset: false
    validation:
      target: ldm.data.bvi_vimeo.Hydra_triplet
      params:
        db_dir: ../../phhydraB ## path to vimeo_triplet
        test: True
        train: false
        resize_sz: [512, 512]
        crop_sz: [256,256]
        aug_flip: False
        aug_reverse: false
        aug_rot: False
        aug_blur: False
        small_dataset: false


lightning:
  callbacks:
    setup_callback:
      target: main.SetupCallback
      # resume: "/raid/home/itayerlich/DL_Project/LDMVFI/logs/2024-08-15T11-05-36_vqflow-f32/checkpoints/last.ckpt"
    metrics_over_trainsteps_checkpoint: 
      target: pytorch_lightning.callbacks.ModelCheckpoint
      every_n_train_steps: 5000

    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 10000
        val_batch_frequency: 1000
        max_images: 8
        increase_log_steps: False
        log_images_kwargs: {'N': 1}

  trainer:
    benchmark: True
    max_epochs: 250
    # resume_from_checkpoint: "/raid/home/itayerlich/DL_Project/LDMVFI/logs/2024-08-15T11-05-36_vqflow-f32/checkpoints/last.ckpt"
    distributed_backend: 'ddp'
    # strategy: 'ddp'
